<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User CRUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <nav>
    <ul class="nav-list">
      <li><h1>Users CRUD</h1></li>
      <li><button class="add-user-button" onclick="openAddModal()">Add User</button></li>
    </ul>
  </nav>

  <div class="add-user-modal" style="display: none;">
  <div class="modal-content">
    <h2>Add New User</h2>
    <input type="text" class="add-name" placeholder="Full Name">
    <input type="email" class="add-email" placeholder="Email Address">
    
    <select class="add-gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>

    <select class="add-status">
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>

    <div class="modal-actions">
      <button onclick="addUser()">Save User</button>
      <button onclick="closeAddModal()">Cancel</button>
    </div>
  </div>
</div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Gender</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody class="user-table-body"></tbody>
  </table>

  <div class="add-user-form-container edit-user-modal">
    <div class="add-user-form">
      <h3>Edit User</h3>

      <input type="text" class="edit-name" placeholder="Name" />
      <input type="email" class="edit-email" placeholder="Email" />

      <select class="edit-gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>

      <select class="edit-status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>

      <button onclick="updateUser()">Update User</button>
      <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
